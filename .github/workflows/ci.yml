name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      # Integration tests use Testcontainers (Docker is available on GitHub-hosted runners).
      - run: mvn -B verify

  storefront:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: apps/storefront }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm, cache-dependency-path: apps/storefront/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
        env: { GATEWAY_URL: 'http://localhost:8080' }
      - run: pnpm audit --audit-level high

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

  dependency-and-container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  codeql:
    runs-on: ubuntu-latest
    permissions: { security-events: write, contents: read }
    strategy:
      matrix: { language: [java-kotlin, javascript-typescript] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: github/codeql-action/init@v3
        with: { languages: '${{ matrix.language }}', build-mode: '${{ matrix.language == ''java-kotlin'' && ''manual'' || ''none'' }}' }
      - if: matrix.language == 'java-kotlin'
        run: mvn -B -DskipTests package
      - uses: github/codeql-action/analyze@v3
