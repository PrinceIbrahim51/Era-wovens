# All secrets come from the environment / secret manager. Missing values fail startup (fail closed).
server:
  port: ${CHECKOUT_SERVICE_PORT:8084}
  error:
    include-stacktrace: never
    include-message: never
    whitelabel.enabled: false
  shutdown: graceful
spring:
  application.name: checkout-service
  main.banner-mode: off
  threads.virtual.enabled: true
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/checkout
    username: ${CHECKOUT_DB_USER}
    password: ${CHECKOUT_DB_PASSWORD}
    hikari.maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet.multipart.enabled: false
  jackson.default-property-inclusion: non_null
  mvc.problemdetails.enabled: false
platform:
  security:
    gateway-token: ${GATEWAY_INTERNAL_TOKEN}
    service-token: ${SERVICE_INTERNAL_TOKEN}
management:
  endpoints.web.exposure.include: health
  endpoint.health:
    show-details: never
    probes.enabled: true
logging.pattern.level: "%5p [%X{requestId:-}]"
services:
  catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8081}
  inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
  cart-url: ${CART_SERVICE_URL:http://localhost:8083}
  order-url: ${ORDER_SERVICE_URL:http://localhost:8085}
  cod-url: ${COD_SERVICE_URL:http://localhost:8086}
checkout:
  quote-ttl: PT15M
  quote-signing-secret: ${CHECKOUT_QUOTE_SECRET}
  reservation-ttl-seconds: 1800
  bulk-minimum-units: ${BULK_MINIMUM_UNITS:10}
  bulk-allow-mixed-skus: ${BULK_ALLOW_MIXED_SKUS:true}
  # Indicative GST on apparel (tax-inclusive prices). Confirm with a qualified tax adviser before launch.
  tax:
    low-rate-bp: 500
    high-rate-bp: 1800
    threshold-per-piece-paise: 250000
  shipping:
    regular-fee-paise: 9900
    regular-free-from-paise: 299900
    bulk-fee-paise: 49900
    bulk-free-from-paise: 2500000
  non-serviceable-pincode-prefixes: ${NON_SERVICEABLE_PINCODE_PREFIXES:}
