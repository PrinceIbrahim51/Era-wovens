# All secrets come from the environment / secret manager. Missing values fail startup (fail closed).
server:
  port: ${PAYMENT_SERVICE_PORT:8087}
  error:
    include-stacktrace: never
    include-message: never
    whitelabel.enabled: false
  shutdown: graceful
spring:
  application.name: payment-service
  main.banner-mode: off
  threads.virtual.enabled: true
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/payments
    username: ${PAYMENTS_DB_USER}
    password: ${PAYMENTS_DB_PASSWORD}
    hikari.maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet.multipart.enabled: false
  jackson.default-property-inclusion: non_null
  mvc.problemdetails.enabled: false
platform:
  security:
    gateway-token: ${GATEWAY_INTERNAL_TOKEN}
    service-token: ${SERVICE_INTERNAL_TOKEN}
management:
  endpoints.web.exposure.include: health
  endpoint.health:
    show-details: never
    probes.enabled: true
logging.pattern.level: "%5p [%X{requestId:-}]"
services:
  order-url: ${ORDER_SERVICE_URL:http://localhost:8085}
payments:
  razorpay:
    # TEST MODE ONLY. The service refuses to start with live keys or a non-test mode.
    enabled: ${RAZORPAY_ENABLED:false}
    mode: ${RAZORPAY_MODE:test}
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    api-base-url: ${RAZORPAY_API_BASE_URL:https://api.razorpay.com}
    merchant-name: Aurelia (Test Mode)
