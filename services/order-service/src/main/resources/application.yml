# All secrets come from the environment / secret manager. Missing values fail startup (fail closed).
server:
  port: ${ORDER_SERVICE_PORT:8085}
  error:
    include-stacktrace: never
    include-message: never
    whitelabel.enabled: false
  shutdown: graceful
spring:
  application.name: order-service
  main.banner-mode: off
  threads.virtual.enabled: true
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/orders
    username: ${ORDERS_DB_USER}
    password: ${ORDERS_DB_PASSWORD}
    hikari.maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet.multipart.enabled: false
  jackson.default-property-inclusion: non_null
  mvc.problemdetails.enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: simple
platform:
  security:
    gateway-token: ${GATEWAY_INTERNAL_TOKEN}
    service-token: ${SERVICE_INTERNAL_TOKEN}
management:
  endpoints.web.exposure.include: health
  endpoint.health:
    show-details: never
    probes.enabled: true
logging.pattern.level: "%5p [%X{requestId:-}]"
services:
  inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
orders:
  payment-window: PT30M
  draft-ttl: PT30M
  outbox-interval: PT2S
  expiry-interval: PT30S
