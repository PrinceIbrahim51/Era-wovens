# All secrets come from the environment / secret manager. Missing values fail startup (fail closed).
server:
  port: ${NOTIFICATION_SERVICE_PORT:8088}
  error:
    include-stacktrace: never
    include-message: never
    whitelabel.enabled: false
  shutdown: graceful
spring:
  application.name: notification-service
  main.banner-mode: off
  threads.virtual.enabled: true
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/notifications
    username: ${NOTIFICATIONS_DB_USER}
    password: ${NOTIFICATIONS_DB_PASSWORD}
    hikari.maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet.multipart.enabled: false
  jackson.default-property-inclusion: non_null
  mvc.problemdetails.enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    listener.simple:
      default-requeue-rejected: false
      acknowledge-mode: auto
      retry:
        enabled: true
        max-attempts: 5
        initial-interval: 1s
        multiplier: 2
platform:
  security:
    gateway-token: ${GATEWAY_INTERNAL_TOKEN}
    service-token: ${SERVICE_INTERNAL_TOKEN}
management:
  endpoints.web.exposure.include: health
  endpoint.health:
    show-details: never
    probes.enabled: true
logging.pattern.level: "%5p [%X{requestId:-}]"
notifications:
  from-address: ${NOTIFICATION_FROM_ADDRESS:orders@example.invalid}
